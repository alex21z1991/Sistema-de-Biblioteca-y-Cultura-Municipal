<div class="selector" [class.selector--abierto]="abierto">

  <button
    type="button"
    class="selector__boton"
    [id]="inputId || null"
    [disabled]="deshabilitado"
    [attr.aria-label]="ariaLabel || null"
    aria-haspopup="listbox"
    [attr.aria-expanded]="abierto"
    (click)="alternar()"
    (keydown)="alPresionarBoton($event)"
  >
    <span class="selector__texto" [class.selector__texto--vacio]="!seleccion">
      {{ seleccion ? seleccion.etiqueta : placeholder }}
    </span>
    <svg class="selector__flecha" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
      <path fill="currentColor" d="M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6z"/>
    </svg>
  </button>

  <div
    *ngIf="abierto"
    #panel
    class="selector__popup"
    [class.selector__popup--arriba]="arriba"
    tabindex="-1"
    (keydown)="alPresionarTecla($event)"
  >

    <div *ngIf="buscable" class="selector__buscar">
      <input
        #buscador
        type="search"
        class="selector__buscador"
        [value]="consulta"
        [placeholder]="textoBuscar"
        aria-label="Buscar en la lista"
        autocomplete="off"
        (input)="alEscribir($any($event.target).value)"
      >
    </div>

    <ul class="selector__lista" role="listbox">

      <ng-container *ngFor="let fila of filas">

        <li *ngIf="fila.grupo" class="selector__grupo" role="presentation">{{ fila.grupo }}</li>

        <li
          *ngIf="fila.opcion as opcion"
          class="selector__opcion"
          role="option"
          [class.selector__opcion--elegida]="esSeleccionada(opcion)"
          [class.selector__opcion--activa]="fila.indice === activo"
          [class.selector__opcion--deshabilitada]="opcion.deshabilitada"
          [attr.aria-selected]="esSeleccionada(opcion)"
          [attr.aria-disabled]="opcion.deshabilitada || null"
          (click)="elegir(opcion)"
          (mousemove)="!opcion.deshabilitada && (activo = fila.indice!)"
        >
          <span class="selector__etiqueta">{{ opcion.etiqueta }}</span>
          <span *ngIf="opcion.detalle" class="selector__detalle">{{ opcion.detalle }}</span>
          <svg *ngIf="esSeleccionada(opcion)" class="selector__check" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path fill="currentColor" d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/>
          </svg>
        </li>

      </ng-container>

      <li *ngIf="filas.length === 0" class="selector__vacio">No hay resultados.</li>

    </ul>

  </div>

</div>
