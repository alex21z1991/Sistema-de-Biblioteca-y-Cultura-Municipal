<!-- Se agrega la clase global 'contenedor' para el ancho máximo oficial -->
<div class="explore-container contenedor">
  <header class="page-header">
    <h1>Explorar actividades y eventos</h1>
    <p class="subtitle">Descubre e inscríbete en las próximas actividades municipales.</p>
  </header>

  <!-- Filtros usando el puente FiltroEnum para evitar errores TypeScript -->
  <div class="filter-bar">
    <button 
      [class.active]="filtroTipo === FiltroEnum.Todos" 
      (click)="filtroTipo = FiltroEnum.Todos">
      Todos
    </button>
    <button 
      [class.active]="filtroTipo === FiltroEnum.Taller" 
      (click)="filtroTipo = FiltroEnum.Taller">
      Talleres
    </button>
    <button 
      [class.active]="filtroTipo === FiltroEnum.Evento" 
      (click)="filtroTipo = FiltroEnum.Evento">
      Eventos
    </button>
  </div>

  <!-- Actividades -->
  <div class="cards-grid">
    <app-activity-card
      *ngFor="let item of actividadesFiltradas"
      [actividad]="item"
      [yaInscrito]="estaInscrito(item)"
      (inscribir)="inscribir($event)">
    </app-activity-card>
  </div>
</div>
