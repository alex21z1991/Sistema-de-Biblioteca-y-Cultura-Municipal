<div class="explore-container">
  <header class="page-header">
    <h1>Explorar actividades y eventos</h1>
    <p class="subtitle">Descubre e inscríbete en las próximas actividades municipales.</p>
  </header>

  <!-- Filtros -->
  <div class="filter-bar">
    <button 
      [class.active]="filtroTipo === 'Todos'" 
      (click)="filtroTipo = 'Todos'">
      Todos
    </button>
    <button 
      [class.active]="filtroTipo === 'Taller'" 
      (click)="filtroTipo = 'Taller'">
      Talleres
    </button>
    <button 
      [class.active]="filtroTipo === 'Evento'" 
      (click)="filtroTipo = 'Evento'">
      Eventos
    </button>
  </div>

  <!-- Actividades -->
  <div class="cards-grid">
    <app-activity-card
      *ngFor="let item of actividadesFiltradas"
      [actividad]="item"
      [yaInscrito]="estaInscrito(item)"
      (inscribir)="inscribir($event)">
    </app-activity-card>
  </div>
</div>
