<div class="activity-card">
  <div class="card-header">
    <span class="badge" [ngClass]="actividad.tipo.toLowerCase()">{{ actividad.tipo }}</span>
    <span class="capacity-tag" [class.full]="actividad.inscritos >= actividad.capacidad">
      {{ actividad.capacidad - actividad.inscritos }} cupos disponibles
    </span>
  </div>

  <h3 class="card-title">{{ actividad.titulo }}</h3>
  <p class="card-description">{{ actividad.descripcion }}</p>

  <div class="card-details">
    <div class="detail-item">
      <span class="detail-label">Fecha y hora</span>
      <span class="detail-value">{{ actividad.fecha | date:'dd/MM/yyyy - HH:mm' }}</span>
    </div>
    <div class="detail-item">
      <span class="detail-label">Lugar</span>
      <span class="detail-value">{{ actividad.lugar }}</span>
    </div>
    <div class="detail-item">
      <span class="detail-label">Inscritos</span>
      <span class="detail-value">{{ actividad.inscritos }} / {{ actividad.capacidad }}</span>
    </div>
  </div>

  <div class="card-footer">
    <button 
      class="btn-primary" 
      [disabled]="actividad.inscritos >= actividad.capacidad || yaInscrito"
      (click)="onInscribir()">
      {{ actividad.inscritos >= actividad.capacidad ? 'Agotado' : yaInscrito ? 'Ya inscrito' : 'Inscribirme' }}
    </button>
  </div>
</div>
