<div class="devoluciones-container">

  <header class="welcome">
    <h1>Registrar devolución</h1>
  </header>

  <section class="section">

    <h2 class="titulo-seccion">Préstamos</h2>

    <!-- Notificación del sistema -->
    <div
      *ngIf="mensaje"
      class="alerta"
      [class.alerta--ok]="mensajeEsExito"
      [class.alerta--error]="!mensajeEsExito"
      [attr.role]="mensajeEsExito ? 'status' : 'alert'"
    >
      {{ mensaje }}
    </div>

    <label class="etiqueta" for="buscar">Buscar por libro, usuario o número de préstamo</label>

    <div class="buscador-caja">
      <svg class="buscador-icono" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14"/>
      </svg>
      <input
        id="buscar"
        class="campo buscador"
        type="search"
        [(ngModel)]="busqueda"
        placeholder="Buscar préstamo"
        autocomplete="off"
      />
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>N.º</th>
            <th>Usuario</th>
            <th>Libro</th>
            <th>Fecha préstamo</th>
            <th>Estado</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let p of prestamosFiltrados">
            <td>{{ p.id }}</td>
            <td>{{ p.usuario }}</td>
            <td class="titulo-recurso">{{ p.titulo }}</td>
            <td>{{ p.fechaPrestamo | date: 'dd/MM/yyyy' }}</td>
            <td>
              <span class="pill" [class.pill--devuelto]="p.estado === 'Devuelto'" [class.pill--prestado]="p.estado !== 'Devuelto'">
                {{ p.estado }}
              </span>
            </td>
            <td>
              <button
                type="button"
                class="boton boton--chico"
                [disabled]="p.estado === 'Devuelto'"
                (click)="devolverLibro(p.id)"
              >
                Registrar devolución
              </button>
            </td>
          </tr>
        </tbody>
      </table>

      <div *ngIf="prestamosFiltrados.length === 0" class="empty-state">
        <h3>No se encontraron préstamos.</h3>
      </div>
    </div>

  </section>

</div>
