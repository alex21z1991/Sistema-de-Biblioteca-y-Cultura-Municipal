<ul class="resumen-lista">
  <li class="resumen-item" *ngFor="let recurso of recursos">

    <div class="resumen-info">
      <span class="resumen-tipo">{{ recurso.tipo }}</span>
      <h3>{{ recurso.titulo }}</h3>
      <p>{{ recurso.autor }} · {{ recurso.categoria }}</p>
    </div>

    <div class="resumen-acciones">
      <span
        class="resumen-stock"
        [class.resumen-stock--agotado]="!recurso.activo || disponibles(recurso) === 0">
        {{ recurso.activo ? disponibles(recurso) + ' de ' + recurso.ejemplares + ' disponible(s)' : 'No disponible' }}
      </span>

      <button
        type="button"
        class="boton-quitar"
        [disabled]="bloqueado"
        [attr.aria-label]="'Quitar ' + recurso.titulo + ' de la selección'"
        (click)="quitarRecurso(recurso)">
        Quitar
      </button>
    </div>

  </li>
</ul>
