<aside class="sidebar">

    <h3>Menú</h3>

    <nav>

        <a routerLink="/admin-panel">
            Inicio
        </a>

        @if (!esAdmin) {
            <a routerLink="/explorar">
                Explorar
            </a>

            <a
                routerLink="/reservas"
                routerLinkActive="activo">
                Reservas
            </a>
            <a routerLink="/carrito" routerLinkActive="activo">
                Carrito ({{ (cartIds$ | async)?.length ?? 0 }})
            </a>
        }

        @if (esAdmin) {
            <a routerLink="/admin-catalogo">
                Catálogo
            </a>
        }
        <a routerLink="/multas">
            Multas
        </a>

        <a routerLink="/perfil">
            Perfil
        </a>

    </nav>

    <button type="button" (click)="cerrarSesion()">
        Cerrar sesión
    </button>

</aside>
