<aside class="sidebar">

    <h3>Menú</h3>

    <nav>

        <a routerLink="/admin-panel">
            {{ esAdmin ? 'Cartelera' : 'Inicio' }}
        </a>

        @if (!esAdmin) {
            <a routerLink="/explorar">
                Explorar
            </a>

            <a
                routerLink="/reservas"
                routerLinkActive="activo">
                Reservas
            </a>
        }

        @if (esAdmin) {
            <a routerLink="/admin-catalogo">
                Catálogo
            </a>

            <a routerLink="/admin-prestamos" routerLinkActive="activo">
                Préstamos
            </a>
            <a routerLink="/admin-devoluciones" routerLinkActive="activo">Devoluciones</a>
        }

    </nav>

    <div class="sidebar-actions">
        <ng-container *ngIf="isCitizen">
            <a *ngIf="cartIds$ | async as cartIds"
               class="cart-button"
               routerLink="/carrito"
               routerLinkActive="cart-button--active"
               ariaCurrentWhenActive="page"
               title="Mi carrito"
               [attr.aria-label]="'Carrito, ' + cartIds.length + (cartIds.length === 1 ? ' recurso seleccionado' : ' recursos seleccionados')">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                     stroke-linejoin="round" aria-hidden="true" focusable="false">
                    <path d="M3 3h2l3 13h11l2-9H6" />
                    <circle cx="9" cy="21" r="1" />
                    <circle cx="18" cy="21" r="1" />
                </svg>
                <span *ngIf="cartIds.length > 0" class="cart-count" aria-hidden="true">{{ cartIds.length }}</span>
            </a>
        </ng-container>

        <button type="button" (click)="cerrarSesion()">
            Cerrar sesión
        </button>
    </div>

</aside>
