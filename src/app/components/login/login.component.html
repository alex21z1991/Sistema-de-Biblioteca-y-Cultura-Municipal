<div class="login-wrapper">
    <div class="login-card">
        <!-- Cabecera y Títulos -->
        <div class="brand-header">
            <div class="logo-box">→]</div> <!-- Símbolo referencial similar a la captura -->
            <h2>Iniciar sesión</h2>
            <p class="subtitle">Accede con tu cuenta municipal</p>
        </div>

        <!-- Alerta de error (Usando la clase oficial del manual) -->
        <div *ngIf="errorMessage" class="alerta--error">
            {{errorMessage}}
        </div>

        <!-- Formulario -->
        <form (ngSubmit)="onSubmit()" #loginForm="ngForm">

            <!-- Username (Correo electrónico según la captura) -->
            <div class="campo-grupo">
                <label for="username" class="etiqueta">Correo electrónico</label>
                <input 
                    type="text"
                    id="username"
                    name="username"
                    class="campo"
                    [(ngModel)]="loginData.username"
                    placeholder="tucorreo@ejemplo.com" 
                    required
                    #usernameCtrl="ngModel"
                    [class.input-error]="usernameCtrl.invalid && usernameCtrl.touched"
                />
                <span class="field-error" *ngIf="usernameCtrl.invalid && usernameCtrl.touched">
                    El correo es obligatorio.
                </span>
            </div>

            <!-- Password -->
            <div class="campo-grupo">
                <label for="password" class="etiqueta">Contraseña</label>
                <input 
                    type="password"
                    id="password"
                    name="password"
                    class="campo"
                    [(ngModel)]="loginData.password" 
                    placeholder="••••••••"
                    required
                    #passwordCtrl="ngModel"
                    [class.input-error]="passwordCtrl.invalid && passwordCtrl.touched"
                />
                <span class="field-error" *ngIf="passwordCtrl.invalid && passwordCtrl.touched">
                    La contraseña es obligatoria.
                </span>
            </div>

            <!-- Enlace extra que aparece en la imagen -->
            <div class="recuperar-link">
                <a href="#">¿Olvidaste tu contraseña?</a>
            </div>

            <!-- Botón (Usa las clases base que pusimos en styles.css) -->
            <button type="submit" class="boton boton--primario btn-submit" [disabled]="!loginForm.form.valid || isLoading">
                {{ isLoading ? 'Iniciando...' : 'Ingresar' }}
            </button>
        </form>

        <!-- Footer de tarjeta como en la captura -->
        <div class="card-footer">
            <p>¿No tienes cuenta? <a href="#">Crear una</a></p>
        </div>
    </div>
</div>
